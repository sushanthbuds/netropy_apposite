<svg viewBox="0 0 940 600" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arrowStart" markerWidth="10" markerHeight="10" refX="0" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M8,0 L0,3 L8,6 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Host boundary -->
  <rect x="20" y="20" width="900" height="560" rx="14" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="40" y="47" font-size="15" font-weight="700" fill="#334155">Single Virtualization Host — QEMU/KVM · VMware ESXi · AWS  (all traffic stays on one host)</text>

  <!-- End-to-end traffic annotation -->
  <line x1="165" y1="120" x2="775" y2="120" stroke="#dc2626" stroke-width="2" stroke-dasharray="7 5" marker-start="url(#arrowStart)" marker-end="url(#arrow)"/>
  <rect x="300" y="88" width="340" height="22" rx="6" fill="#fff" stroke="#dc2626" stroke-width="1"/>
  <text x="470" y="103" font-size="11" font-weight="600" fill="#dc2626" text-anchor="middle">iperf3 test traffic — forwarded by Netropy in L2 (Bridge) or L3 (Routed) mode</text>

  <!-- ================= Linux-1 ================= -->
  <rect x="70" y="175" width="190" height="150" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="165" y="198" font-size="12.5" font-weight="700" fill="#15803d" text-anchor="middle">Linux-1</text>
  <text x="165" y="212" font-size="9" fill="#166534" text-anchor="middle">Ubuntu Server LTS + iperf3</text>
  <line x1="82" y1="218" x2="248" y2="218" stroke="#15803d" stroke-width="0.8" opacity="0.5"/>
  <rect x="150" y="228" width="100" height="22" rx="11" fill="#fff" stroke="#15803d" stroke-width="1.2"/>
  <text x="200" y="243" font-size="9.5" fill="#166534" text-anchor="middle">Data Port</text>
  <rect x="110" y="288" width="100" height="22" rx="11" fill="#fff" stroke="#15803d" stroke-width="1.2"/>
  <text x="160" y="303" font-size="9.5" fill="#166534" text-anchor="middle">Mgmt Port</text>

  <!-- ================= Netropy ================= -->
  <rect x="375" y="150" width="190" height="200" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="2.5"/>
  <text x="470" y="173" font-size="13" font-weight="700" fill="#0369a1" text-anchor="middle">Netropy Virtual Edition</text>
  <text x="470" y="187" font-size="9" fill="#075985" text-anchor="middle">Network Emulator (UIO/DPDK-style)</text>
  <line x1="387" y1="193" x2="553" y2="193" stroke="#0369a1" stroke-width="0.8" opacity="0.5"/>
  <rect x="386" y="228" width="82" height="22" rx="11" fill="#fff" stroke="#0369a1" stroke-width="1.2"/>
  <text x="427" y="243" font-size="9" fill="#075985" text-anchor="middle">Data Port-1</text>
  <rect x="472" y="228" width="82" height="22" rx="11" fill="#fff" stroke="#0369a1" stroke-width="1.2"/>
  <text x="513" y="243" font-size="9" fill="#075985" text-anchor="middle">Data Port-2</text>
  <rect x="425" y="300" width="90" height="22" rx="11" fill="#fff" stroke="#0369a1" stroke-width="1.2"/>
  <text x="470" y="315" font-size="9.5" fill="#075985" text-anchor="middle">Mgmt Port</text>

  <!-- ================= Linux-2 ================= -->
  <rect x="680" y="175" width="190" height="150" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="775" y="198" font-size="12.5" font-weight="700" fill="#15803d" text-anchor="middle">Linux-2</text>
  <text x="775" y="212" font-size="9" fill="#166534" text-anchor="middle">Ubuntu Server LTS + iperf3</text>
  <line x1="692" y1="218" x2="858" y2="218" stroke="#15803d" stroke-width="0.8" opacity="0.5"/>
  <rect x="690" y="228" width="100" height="22" rx="11" fill="#fff" stroke="#15803d" stroke-width="1.2"/>
  <text x="740" y="243" font-size="9.5" fill="#166534" text-anchor="middle">Data Port</text>
  <rect x="725" y="288" width="100" height="22" rx="11" fill="#fff" stroke="#15803d" stroke-width="1.2"/>
  <text x="775" y="303" font-size="9.5" fill="#166534" text-anchor="middle">Mgmt Port</text>

  <!-- ================= Data Subnet 1 ================= -->
  <rect x="268" y="222" width="99" height="34" rx="17" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.6"/>
  <text x="317" y="236" font-size="10" font-weight="700" fill="#5b21b6" text-anchor="middle">Data Subnet-1</text>
  <text x="317" y="248" font-size="8" fill="#6d28d9" text-anchor="middle">e.g. 10.0.1.0/24</text>
  <line x1="250" y1="239" x2="268" y2="239" stroke="#6d28d9" stroke-width="2"/>
  <line x1="367" y1="239" x2="386" y2="239" stroke="#6d28d9" stroke-width="2"/>

  <!-- ================= Data Subnet 2 ================= -->
  <rect x="573" y="222" width="99" height="34" rx="17" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.6"/>
  <text x="622" y="236" font-size="10" font-weight="700" fill="#5b21b6" text-anchor="middle">Data Subnet-2</text>
  <text x="622" y="248" font-size="8" fill="#6d28d9" text-anchor="middle">e.g. 10.0.2.0/24</text>
  <line x1="554" y1="239" x2="573" y2="239" stroke="#6d28d9" stroke-width="2"/>
  <line x1="672" y1="239" x2="690" y2="239" stroke="#6d28d9" stroke-width="2"/>

  <!-- ================= Management Subnet bus ================= -->
  <rect x="90" y="430" width="760" height="40" rx="20" fill="#fef3c7" stroke="#b45309" stroke-width="1.8"/>
  <text x="470" y="450" font-size="11.5" font-weight="700" fill="#92400e" text-anchor="middle">Management Subnet   (e.g. 10.0.0.0/24)</text>
  <text x="470" y="463" font-size="8.5" fill="#b45309" text-anchor="middle">SSH / Web UI access to all three instances + credentials handed to the user</text>
  <line x1="160" y1="310" x2="160" y2="430" stroke="#b45309" stroke-width="2"/>
  <line x1="470" y1="322" x2="470" y2="430" stroke="#b45309" stroke-width="2"/>
  <line x1="775" y1="310" x2="775" y2="430" stroke="#b45309" stroke-width="2"/>

  <!-- ================= Legend ================= -->
  <rect x="90" y="498" width="18" height="14" rx="3" fill="#e0f2fe" stroke="#0369a1"/>
  <text x="115" y="510" font-size="10" fill="#334155">Netropy Virtual Edition (device under test)</text>
  <rect x="430" y="498" width="18" height="14" rx="3" fill="#dcfce7" stroke="#15803d"/>
  <text x="455" y="510" font-size="10" fill="#334155">Ubuntu Linux traffic endpoints (iperf3)</text>

  <rect x="90" y="522" width="18" height="14" rx="3" fill="#ede9fe" stroke="#6d28d9"/>
  <text x="115" y="534" font-size="10" fill="#334155">Data-plane subnet (UIO/DPDK ports; SR-IOV / passthrough in Phase 2)</text>

  <rect x="90" y="546" width="18" height="14" rx="3" fill="#fef3c7" stroke="#b45309"/>
  <text x="115" y="558" font-size="10" fill="#334155">Management subnet (out-of-band control)</text>
  <line x1="432" y1="553" x2="450" y2="553" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="455" y="557" font-size="10" fill="#334155">End-to-end test traffic through the emulator</text>
</svg>
