[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netropy-lab"
version = "0.1.0"
description = "CLI to provision a Netropy VE test lab on KVM or ESXi"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jsonschema>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
netropy-lab = "netropy_lab.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["netropy_lab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
